# Tracks public AIHOT main inside this private repository without touching YiHot main.
# This workflow NEVER runs upstream code, merges into main, or deploys production.
# The vendor branch fast-forwards only; the rebuild branch is created once and
# remains pinned as a safe starting point for explicit YiHot-specific migration.
name: AIHOT upstream sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aihot-upstream-sync.yml
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * *" # 04:23 Beijing time; GitHub schedules use UTC

permissions:
  contents: read

concurrency:
  group: aihot-upstream-sync
  cancel-in-progress: false

jobs:
  import-history:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out YiHot (main stays untouched)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          token: ${{ secrets.AIHOT_SYNC_TOKEN || github.token }}
          fetch-depth: 1

      - name: Fetch upstream and sync when authorized
        shell: bash
        env:
          HAS_SYNC_TOKEN: ${{ secrets.AIHOT_SYNC_TOKEN != '' }}
        run: |
          set -euo pipefail
          git remote add aihot-public https://github.com/KKKKhazix/AIHOT.git
          git fetch --no-tags aihot-public +refs/heads/main:refs/remotes/aihot-public/main
          upstream_sha="$(git rev-parse refs/remotes/aihot-public/main)"
          vendor_ref="refs/heads/vendor/aihot-main"
          vendor_sha="$(git ls-remote --heads origin "$vendor_ref" | cut -f1)"

          if [[ "$upstream_sha" == "$vendor_sha" ]]; then
            sync_state="up to date"
          elif [[ "$HAS_SYNC_TOKEN" == "true" ]]; then
            # Never force-push. An upstream history rewrite requires manual review.
            git push origin "${upstream_sha}:${vendor_ref}"
            sync_state="fast-forwarded"
          else
            sync_state="update pending: AIHOT_SYNC_TOKEN not configured"
            echo "::warning::New AIHOT commit ${upstream_sha} is not in vendor/aihot-main. A token with repository Contents and Workflows write permission is required for automatic import of upstream workflow history."
          fi

          rebuild_ref="refs/heads/rebuild/aihot-aligned"
          rebuild_state="preserved"
          if [[ -z "$(git ls-remote --heads origin "$rebuild_ref")" ]]; then
            if [[ "$HAS_SYNC_TOKEN" == "true" ]]; then
              git push origin "${upstream_sha}:${rebuild_ref}"
              rebuild_state="created from original AIHOT history"
            else
              rebuild_state="not created (requires authorized import)"
            fi
          fi

          {
            echo "## AIHOT upstream sync"
            echo ""
            echo "- Public AIHOT main: \`$upstream_sha\`"
            echo "- Private vendor branch before this run: \`${vendor_sha:-not yet created}\`"
            echo "- Vendor sync: $sync_state"
            echo "- Rebuild branch: $rebuild_state"
            echo "- Old YiHot main / production: unchanged by this job"
          } >> "$GITHUB_STEP_SUMMARY"
