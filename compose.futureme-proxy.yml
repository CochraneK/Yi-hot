# OPTIONAL FutureMe integration. Run only when FutureMe is deployed.
# Base docker-compose.yml remains runnable without FutureMe or its network.
# First: docker network create futureme_proxy (if it does not exist).
# Run: docker compose -f docker-compose.yml -f compose.futureme-proxy.yml up -d --no-build --no-deps web
services:
  web:
    networks:
      - default
      - futureme_proxy

networks:
  futureme_proxy:
    external: true
    name: futureme_proxy
