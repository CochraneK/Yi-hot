<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="366" viewBox="0 0 1280 366" role="img" aria-label="YiHot infographic"><defs><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#325779" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1280" height="366" rx="26" fill="#f7faff" stroke="none" /><text x="40" y="55" fill="#153356" font-size="29" font-weight="760" font-family="Inter,system-ui,-apple-system,'Noto Sans SC','Microsoft YaHei',sans-serif" >从信源到总报：一个完整、可审查的流程</text><text x="40" y="83" fill="#668099" font-size="17" font-weight="400" font-family="Inter,system-ui,-apple-system,'Noto Sans SC','Microsoft YaHei',sans-serif" >不是简单抓取新闻，而是整理信息、保留出处，再交给读者判断。</text><rect x="35" y="123" width="231" height="195" rx="21" fill="#ffffff" stroke="#e0e8f0" filter="url(#shadow)"/><rect x="52" y="140" width="61" height="61" rx="17" fill="#ebf3ff" stroke="none" /><text x="65" y="179" fill="#477cdd" font-size="25" font-weight="820" font-family="Inter,system-ui,-apple-system,'Noto Sans SC','Microsoft YaHei',sans-serif" >01</text><text x="52" y="233" fill="#18395f" font-size="23" font-weight="730" font-family="Inter,system-ui,-apple-system,'Noto Sans SC','Microsoft YaHei',sans-serif" >发现信源</text><text x="52" y="264" fill="#657c91" font-size="16" font-weight="480" font-family="Inter,system-ui,-apple-system,'Noto Sans SC','Microsoft YaHei',sans-serif" >网站 / RSS</text><text x="52" y="289" fill="#657c91" font-size="16" font-weight="480" font-family="Inter,system-ui,-apple-system,'Noto Sans SC','Microsoft YaHei',sans-serif" >公众号 / 邮件</text><path d="M270 216 h13 l-5 -6 m5 6 l-5 6" stroke="#58a3d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="288" y="123" width="231" height="195" rx="21" fill="#ffffff" stroke="#e0e8f0" filter="url(#shadow)"/><rect x="305" y="140" width="61" height="61" rx="17" fill="#edf9f4" stroke="none" /><text x="318" y="179" fill="#218d70" font-size="25" font-weight="820" font-fam