<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目入口</title>
  <meta name="description" content="YiHot 公益信息聚合与 FutureMe 未来自我体验的独立项目入口。" />
  <style>
    :root {
      --bg: #f7f6f2;
      --card: #ffffff;
      --ink: #201f1b;
      --muted: #6d6a60;
      --line: #e5e2d8;
      --faint: #a09c8f;
      --accent: #2f6f4f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      padding: 56px 20px 40px;
    }
    header { text-align: center; margin-bottom: 40px; }
    h1 { margin: 0 0 10px; font-size: 24px; font-weight: 600; letter-spacing: .04em; }
    header p { margin: 0; font-size: 14px; color: var(--muted); }
    main { width: 100%; max-width: 620px; display: grid; gap: 14px; }
    .card {
      display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 20px 22px; text-decoration: none; color: inherit;
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    a.card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(32, 31, 27, .07); }
    .card h2 { margin: 0; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .tag { font-size: 11px; font-weight: 500; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 9px; letter-spacing: .05em; }
    .card p { margin: 8px 0 0; font-size: 13.5px; line-height: 1.7; color: var(--muted); }
    .path { margin-top: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--faint); }
    .card.soon { border-style: dashed; background: transparent; }
    .card.soon h2 { color: var(--muted); font-weight: 500; }
    footer { margin-top: auto; padding-top: 48px; font-size: 12px; color: var(--faint); }
    @media (max-width: 480px) { body { padding-top: 40px; } }
  </style>
</head>
<body>
  <header>
    <h1>项目入口</h1>
    <p>一台服务器 · 多个项目，持续建设中</p>
  </header>
  <main>
    <a class="card" href="/yihot/">
      <h2>Yi-Hot<span class="tag">公益</span></h2>
      <p>公益领域信息聚合：实时收录政府、基金会与国际组织的动态、法规与资助信息。</p>
      <div class="path">/yihot/</div>
    </a>
    <a class="card" href="/futureme/">
      <h2>FutureMe<span class="tag">未来自我</span></h2>
      <p>从当下出发，与一种可能的未来自己对话。文字、语音与未来形象，慢慢探索。</p>
      <div class="path">/futureme/</div>
    </a>
    <div class="card soon">
      <h2>更多项目</h2>
      <p>陆续加入。</p>
    </div>
  </main>
  <footer>49.233.72.222</footer>
</body>
</html>
