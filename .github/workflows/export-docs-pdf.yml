name: Export YiHot PDF manuals

on:
  push:
    branches: [main]
    paths:
      - README.md
      - MAINTENANCE.md
      - scripts/export_docs_pdf.py
      - .github/workflows/export-docs-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

# 只允许一个导出在跑。两个同时跑会各自提交一份 PDF、后推的那个被拒，
# 白白浪费一次 15 分钟的渲染；排队等反而更快。
concurrency:
  group: export-docs-pdf
  cancel-in-progress: false

jobs:
  export:
    name: Render and publish PDFs
    runs-on: ubuntu-latest
    # 15 分钟不够：装中文字体 + weasyprint 一圈依赖在冷机上要十来分钟，
    # 39837908016 就是卡在安装步被超时取消（日志一片空白，因为 apt -qq 不出声）。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 拆成两步：合在一起时 apt -qq 静默无声，卡住了也看不出是哪一段。
      - name: Install Chinese fonts
        timeout-minutes: 12
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 fonts-noto-cjk
      - name: Install PDF renderer
        timeout-minutes: 12
        run: |
          python -m pip install --timeout 60 --retries 5 \
            "weasyprint>=63,<70" "mistune>=3,<4" "beautifulsoup4>=4,<5" "pypdf>=5,<7"
      - name: Export README, full handbook and combined PDF
        run: python scripts/export_docs_pdf.py
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: YiHot-PDF-Docs
          path: docs/pdf/*.pdf
          if-no-files-found: error
          retention-days: 90
      - name: Publish updated PDFs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/pdf/YiHot_README.pdf docs/pdf/YiHot_MAINTENANCE.pdf docs/pdf/YiHot_Complete.pdf
          if git diff --cached --quiet; then
            echo "PDFs unchanged"
            exit 0
          fi
          git commit -m "docs(pdf): refresh rendered YiHot manuals [skip ci]"
          # main 可能在渲染这十几分钟里被推过（比如同时推了代码）。裸 push 被拒会让整轮
          # 跑成失败，PDF 白渲染一遍。先 fetch + rebase 到最新再推，最多重试三次。
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 5; continue; }
            git push origin HEAD:main && { echo "PDFs published"; exit 0; }
            echo "push 第 $i 次被拒（远端又前进了），重试"
            sleep 5
          done
          echo "::error::PDF 已渲染但没能推回 main，产物见 artifact，需人工处理"
          exit 1
