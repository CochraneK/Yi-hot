# 上游漂移审计：每个上游提交在我们这里的落地情况
#
# 这个 workflow 只读、只报告、不改代码。它每天跟踪 AIHOT 上游的新提交，逐个判断
# 「这条修复我们是不是已经有了」，把结论汇总成一个 Issue 供人工决策。
#
# 为什么不做全自动 merge：本仓库与上游在 6 周里各自重写了同一批文件（extract.ts、
# collect.ts、group.ts 等），机械 cherry-pick 会冲突或造成降级（例如把已经升到 undici
# 8.12.3 的锁文件摘回 7.30.1）。所以对齐方式定为「自动发现 + 自动判定 + 人工摘入」。
#
# 对比范围是「本仓库 main 落后上游的提交」（HEAD..UPSTREAM）。早期版本用 vendor..upstream，
# vendor 一旦跟上上游就恒为空，导致报告永远说「无需处理」——账号系统就是这样漏掉的。
#
# 判定方法（按可信度排序）：
# 1. patch-id 命中   → 等价补丁已在（git cherry 显示 `-`），唯一可下结论的强证据
# 2. 文件全部不存在  → new-module：可能是整块新功能，优先核查（不再当 skip 跳过）
# 3. 关键词命中      → hinted：只是线索，需人工确认，不能当作「不用摘」
# 4. 其余            → review：需要人看，附改动领域与上游 diff 链接

name: AIHOT upstream drift audit

on:
  schedule:
    # 每天 21:23 UTC = 次日 05:23 北京时间，赶在每日同步之后
    - cron: "23 21 * * *"
  workflow_dispatch:
    inputs:
      lookback:
        description: "回看多少个上游提交（默认 60）"
        required: false
        default: "60"

permissions:
  contents: read
  issues: write

concurrency:
  group: aihot-drift-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch upstream and the vendor mirror
        run: |
          set -euo pipefail
          git remote add aihot-public https://github.com/KKKKhazix/AIHOT.git
          git fetch --no-tags aihot-public +refs/heads/main:refs/remotes/aihot-public/main
          git fetch --no-tags origin +refs/heads/vendor/aihot-main:refs/remotes/origin/vendor/aihot-main || true

      - name: Check drift-audit verdict rules
        run: |
          set -euo pipefail
          node scripts/audit-upstream-drift.mjs --self-test

      - name: Compute per-commit landing status
        env:
          LOOKBACK: ${{ inputs.lookback || '60' }}
        run: |
          set -euo pipefail
          node scripts/audit-upstream-drift.mjs --lookback="$LOOKBACK" --out=artifacts/upstream-drift

      - name: Update the single review Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/post-upstream-drift-issue.mjs --in=artifacts/upstream-drift/summary.json

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aihot-upstream-drift
          path: artifacts/upstream-drift/
          retention-days: 90
          if-no-files-found: warn
