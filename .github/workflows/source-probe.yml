# One-shot, bounded public-source probe. Runs on changes to this workflow or its script only;
# no production deployment, no credentials, no write to source registry.
name: Public source probe

on:
  push:
    paths:
      - .github/workflows/source-probe.yml
      - scripts/source-live-probe.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Probe historical public endpoints (read-only)
        run: node scripts/source-live-probe.mjs
